<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Interface</title>
<style>
/* Clock left, body centre (zoomable), pillar strip right. Live = gold; natal = ghosted.
   Nothing natal lives in this file: every value arrives from ATI's lighting call. */
:root { --bg:#07090d; --panel:#0d1117; --line:#232a35; --ink:#e7e2d6; --muted:#7d8592; --ghost:#3b4250;
  --gold:#e3b23c; --wood:#6fae6a; --fire:#e0705a; --earth:#d9a94e; --metal:#b5bcc6; --water:#5f97d6;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
header { padding:14px 16px 8px; text-align:center; letter-spacing:.18em; font-size:12px; color:var(--muted); }
header b { color:var(--ink); font-weight:600; }
.toggles { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 18px; padding:0 16px 10px; font-size:12px; }
.toggles label { display:flex; gap:6px; align-items:center; color:var(--muted); cursor:pointer; }
.toggles input:disabled + span { opacity:.45; }
.grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.8fr); gap:14px; padding:0 16px 16px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
.panel h2 { margin:0 0 8px; font-size:11px; letter-spacing:.16em; color:var(--muted); font-weight:600; }
svg { width:100%; height:auto; display:block; }
.ring { fill:none; stroke:var(--line); }
.organ { fill:var(--panel); stroke:var(--el); stroke-width:2.5; cursor:pointer; }
.organ.active { fill:var(--gold); stroke:var(--gold); }
.organ:focus { outline:none; stroke-width:5; }
.oname { font-size:11px; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.otime { font-size:9px; text-anchor:middle; fill:var(--muted); pointer-events:none; }
.tag { font-size:9px; text-anchor:middle; fill:var(--gold); pointer-events:none; }
.hand { stroke:var(--gold); stroke-width:2; }
.body-wrap { overflow:hidden; border-radius:8px; touch-action:none; position:relative; }
.zoom { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; }
.zoom button { width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.figure { fill:none; stroke:#5a6170; stroke-width:1.4; }
.band { opacity:.78; cursor:pointer; transition:opacity .2s, filter .2s; }
.band:hover, .band:focus { opacity:.95; outline:none; }
.bandline { stroke:var(--line); stroke-dasharray:3 4; }
.hnum { fill:none; stroke-width:1.6; }
.hnumt { font-size:17px; text-anchor:middle; pointer-events:none; }
.htitle { font-size:19px; font-weight:600; letter-spacing:.06em; pointer-events:none; }
.hregion { font-size:13px; letter-spacing:.08em; pointer-events:none; opacity:.85; }
.band.lit { opacity:1; filter:drop-shadow(0 0 8px var(--gold)) brightness(1.25); }
.mer { fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.85; }
.mer.posterior { stroke-dasharray:6 5; opacity:.7; }
.mer.active { stroke-width:4.5; opacity:1; filter:drop-shadow(0 0 5px var(--gold)); }
.mer.pressure { stroke-width:3.4; opacity:1; }
.mpt { stroke:#07090d; stroke-width:1; cursor:help; }
.mabbr { font-size:12px; font-weight:600; pointer-events:none; }
.mcap { font-size:13px; fill:var(--muted); letter-spacing:.06em; }
.glyph { font-size:20px; text-anchor:middle; pointer-events:none; }
.glyph.now { fill:var(--gold); }
.glyph.natal { fill:var(--ghost); font-size:16px; }
.pill { display:grid; grid-template-columns:3.4rem 1fr 1fr; gap:6px; align-items:baseline; padding:8px 0; border-top:1px solid var(--line); }
.pill:first-of-type { border-top:0; }
.pill .k { font-size:11px; letter-spacing:.12em; color:var(--muted); }
.pill .n { font-size:18px; color:var(--ghost); }
.pill .c { font-size:22px; color:var(--ink); }
.pill.hour .c { color:var(--gold); }
.cols { display:grid; grid-template-columns:3.4rem 1fr 1fr; gap:6px; font-size:10px; color:var(--muted); letter-spacing:.1em; }
.tags { margin:10px 0 0; padding:0; list-style:none; display:grid; gap:4px; font-size:12px; color:var(--muted); }
.tags b { color:var(--gold); font-weight:600; }
#brief { min-height:3em; color:var(--ink); }
.note { font-size:11px; color:var(--muted); margin:8px 0 0; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<header><b>BODY INTERFACE</b> · reference only · ATI lights what it authorizes</header>
<div class="toggles">
  <label><input type="checkbox" id="t-clock" checked><span>Organ clock</span></label>
  <label><input type="checkbox" id="t-houses" checked><span>House sectors</span></label>
  <label><input type="checkbox" id="t-pillars" checked><span>Pillars</span></label>
  <label title="Schematic reference - not for clinical use"><input type="checkbox" id="t-meridians" checked><span>Meridians (schematic)</span></label>
  <label><input type="checkbox" id="t-active"><span>Highlight active meridian</span></label>
</div>
<div class="grid">
  <section class="panel" id="p-clock"><h2>ORGAN CLOCK · 2-HOUR WINDOW</h2><svg id="clock" viewBox="-260 -260 520 520" role="img" aria-label="Organ clock"></svg></section>
  <section class="panel">
    <h2>HOUSES · HEAD TO FEET</h2>
    <div class="body-wrap" id="bodywrap">
      <svg id="body" viewBox="0 0 800 1120" role="img" aria-label="Body with twelve house sectors and schematic meridians"><g id="zoomg"></g></svg>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset zoom">◦</button></div>
    </div>
    <p class="note" id="housenote"></p>
  </section>
  <section class="panel" id="p-pillars">
    <h2>BAZI · NATAL (LOCKED) vs NOW</h2>
    <div class="cols"><span></span><span>NATAL</span><span>NOW</span></div>
    <div id="pillars"></div>
    <ul class="tags" id="tags"></ul>
  </section>
</div>
<section class="panel" style="margin:0 16px 16px"><h2>BRIEFING</h2><p id="brief">Tap an organ on the clock or a house on the body.</p></section>

<!-- Generic reference geometry: the figure and SCHEMATIC meridian routes. Nothing personal.
     tools/check_ati.py holds it to the direction rules (posterior dashed, Spleen/Stomach off the
     midline, ST36 below the knee) and to config/ati/meridian_points.json. -->
<script type="application/json" id="geometry">{"_label":"schematic reference — not for clinical use","_note":"Schematic routes on a front-view figure. Courses follow each channel's documented side and direction - Bladder, Small Intestine and Triple Burner run on the back and are dashed; Spleen and Stomach stay off the midline; ST36 sits below the knee - but positions are NOT measured anatomy and claim no classical accuracy. Each channel is bilateral and drawn on one side for clarity. Replace with a licensed coordinate set if one becomes available.","frame":{"width":400,"height":1080,"midline_x":200,"knee_y":850,"ankle_y":985,"band_height":90},"outline":[[200,0],[222,4],[234,20],[238,48],[234,74],[224,92],[216,102],[216,114],[218,150],[240,164],[272,174],[294,188],[306,206],[314,240],[320,300],[326,360],[332,420],[338,480],[344,540],[348,590],[350,610],[358,630],[362,660],[360,690],[354,712],[344,720],[336,712],[332,690],[328,660],[324,630],[322,606],[316,560],[310,500],[304,440],[298,380],[292,320],[286,272],[278,256],[264,276],[260,340],[254,400],[250,450],[254,500],[262,560],[272,620],[278,680],[274,740],[270,800],[266,850],[264,900],[262,950],[258,985],[262,1010],[266,1040],[268,1070],[260,1080],[232,1080],[226,1060],[224,1030],[224,1000],[222,950],[220,880],[218,850],[214,780],[210,700],[206,662],[200,650],[194,662],[190,700],[186,780],[182,850],[180,880],[178,950],[176,1000],[176,1030],[174,1060],[168,1080],[140,1080],[132,1070],[134,1040],[138,1010],[142,985],[138,950],[136,900],[134,850],[130,800],[126,740],[122,680],[128,620],[138,560],[146,500],[150,450],[146,400],[140,340],[136,276],[122,256],[114,272],[108,320],[102,380],[96,440],[90,500],[84,560],[78,606],[76,630],[72,660],[68,690],[64,712],[56,720],[46,712],[40,690],[38,660],[42,630],[50,610],[52,590],[56,540],[62,480],[68,420],[74,360],[80,300],[86,240],[94,206],[106,188],[128,174],[160,164],[182,150],[184,114],[184,102],[176,92],[166,74],[162,48],[166,20],[178,4]],"meridians":{"lung":{"abbr":"LU","posterior":false,"path":[[152,188],[104,206],[92,260],[84,340],[76,420],[68,500],[62,570],[58,600],[44,662]],"points":{"LU7":[62,572],"LU8":[60,588],"LU9":[58,600]},"label_at":4},"heart":{"abbr":"HT","posterior":false,"path":[[126,258],[118,330],[102,410],[94,490],[88,560],[84,602],[78,650],[68,712]],"points":{"HT5":[86,586],"HT7":[84,602],"HT8":[78,650]},"label_at":3},"small_intestine":{"abbr":"SI","posterior":true,"path":[[64,716],[74,624],[80,606],[90,520],[100,420],[120,300],[132,232],[176,150]],"points":{"SI4":[74,624],"SI5":[78,612],"SI7":[92,500]},"label_at":2},"pericardium":{"abbr":"PC","posterior":false,"path":[[254,250],[278,268],[304,300],[316,420],[328,540],[334,600],[340,650],[344,720]],"points":{"PC6":[330,580],"PC7":[334,600],"PC8":[340,650]},"label_at":4},"large_intestine":{"abbr":"LI","posterior":false,"path":[[354,708],[352,632],[346,600],[338,520],[330,420],[322,320],[316,230],[296,180],[232,160],[214,90],[208,70]],"points":{"LI1":[354,700],"LI4":[352,632],"LI6":[342,560]},"label_at":5},"triple_burner":{"abbr":"TB","posterior":true,"path":[[336,716],[338,608],[334,560],[326,440],[318,320],[312,220],[272,170],[250,110],[244,60]],"points":{"TB4":[338,606],"TB5":[336,586],"TB6":[334,570]},"label_at":3},"stomach":{"abbr":"ST","posterior":false,"path":[[186,60],[184,96],[184,150],[170,240],[168,330],[176,420],[178,520],[160,620],[145,700],[150,800],[150,880],[152,940],[156,985],[156,1030],[160,1078]],"points":{"ST36":[150,880],"ST40":[151,930],"ST42":[156,1030]},"label_at":6},"spleen":{"abbr":"SP","posterior":false,"path":[[174,1066],[176,1040],[174,990],[180,930],[184,850],[188,760],[184,680],[166,640],[158,540],[156,440],[150,330],[146,286]],"points":{"SP3":[176,1040],"SP4":[174,1022]},"label_at":8},"kidney":{"abbr":"KI","posterior":false,"path":[[230,1078],[226,995],[222,950],[220,880],[216,845],[212,760],[208,690],[210,620],[210,440],[226,330],[228,250],[226,178]],"points":{"KI3":[226,990],"KI4":[228,1004],"KI10":[216,845]},"label_at":7},"liver":{"abbr":"LR","posterior":false,"path":[[236,1076],[238,1040],[238,1000],[236,940],[236,880],[226,800],[220,720],[222,660],[246,560],[246,480],[234,350]],"points":{"LR1":[236,1074],"LR3":[238,1040],"LR5":[236,930]},"label_at":8},"gallbladder":{"abbr":"GB","posterior":false,"path":[[222,44],[236,30],[238,60],[226,120],[262,172],[256,300],[250,420],[256,520],[268,600],[276,700],[272,800],[266,850],[264,920],[262,985],[262,1030],[258,1076]],"points":{"GB37":[264,930],"GB40":[262,985],"GB41":[262,1030]},"label_at":7},"bladder":{"abbr":"BL","posterior":true,"front_segment":[[192,48],[194,2]],"path":[[192,48],[194,2],[184,120],[178,300],[178,500],[160,700],[158,850],[156,930],[136,990],[132,1040],[136,1076]],"points":{"BL58":[156,930],"BL64":[134,1035],"BL66":[134,1060]},"label_at":4}}}</script>
<script>
const NS = "http://www.w3.org/2000/svg", TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const GEO = JSON.parse(document.getElementById("geometry").textContent);
const FX = 380, FY = 20, BH = GEO.frame.band_height;          // the figure's place in the body panel
const HUES = ["#a98bd9","#8f86de","#6e93dc","#4fa9b4","#55b07c","#9cba4a","#d9b33f","#e8913c","#e66f41","#dc5466","#cf569a","#b77ccf"];
const ORD = ["1ST","2ND","3RD","4TH","5TH","6TH","7TH","8TH","9TH","10TH","11TH","12TH"];
const EL = {lung:"metal", large_intestine:"metal", stomach:"earth", spleen:"earth", heart:"fire", small_intestine:"fire",
            bladder:"water", kidney:"water", pericardium:"fire", triple_burner:"fire", gallbladder:"wood", liver:"wood"};
const $ = id => document.getElementById(id);
const unwrap = r => { while (r && typeof r === "object" && "result" in r && typeof r.result === "object") r = r.result; return r; };
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.appendChild(e); return e; }
async function ask(task, args) {
  const r = await fetch("/execute", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({task, args: Object.assign({tz: TZ}, args || {})}), credentials: "same-origin"});
  if (!r.ok) throw new Error(`${r.status}`); return unwrap(await r.json());
}
async function brief(kind, id) {
  $("brief").textContent = "Asking ATI…";
  try { const b = await ask("sector_briefing", {kind, id}); $("brief").textContent = b.text || b.error; }
  catch (e) { $("brief").textContent = `Briefing unavailable (${e.message}).`; }
}

// Catmull-Rom through the points, as cubic Beziers: smooth outlines from a short point list.
function smooth(pts, closed) {
  const p = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : [pts[0], ...pts, pts[pts.length - 1]];
  let d = `M${p[1][0]} ${p[1][1]}`;
  for (let i = 1; i < p.length - 2; i++) {
    const [a, b, c, e] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
    d += ` C${b[0] + (c[0] - a[0]) / 6} ${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6} ${c[1] - (e[1] - b[1]) / 6} ${c[0]} ${c[1]}`;
  }
  return d + (closed ? " Z" : "");
}

// Body: the reference figure - twelve equal bands head to feet, labels on the left.
function drawBody(regions) {
  const g = $("zoomg"); g.innerHTML = "";
  const shape = smooth(GEO.outline, true);
  const defs = el("defs", {}, g), cp = el("clipPath", {id: "fig"}, defs); el("path", {d: shape}, cp);
  const labels = el("g", {id: "houselines"}, g);
  for (let i = 0; i < 12; i++) {
    const y = FY + i * BH, cy = y + BH / 2;
    if (i) el("line", {class: "bandline", x1: 10, x2: 790, y1: y, y2: y}, labels);
    el("circle", {class: "hnum", cx: 34, cy, r: 20, stroke: HUES[i]}, labels);
    el("text", {class: "hnumt", x: 34, y: cy + 6, fill: HUES[i]}, labels).textContent = i + 1;
    el("text", {class: "htitle", x: 70, y: cy - 4, fill: HUES[i]}, labels).textContent = `${ORD[i]} HOUSE`;
    el("text", {class: "hregion", x: 70, y: cy + 16, fill: HUES[i]}, labels).textContent = (regions[i + 1] || "").toUpperCase();
  }
  const fig = el("g", {transform: `translate(${FX} ${FY})`}, g);
  const bands = el("g", {"clip-path": "url(#fig)", id: "houses"}, fig);
  for (let i = 0; i < 12; i++) {
    const r = el("rect", {class: "band", x: 0, y: i * BH, width: GEO.frame.width, height: BH, fill: HUES[i],
      tabindex: 0, "data-house": i + 1, "aria-label": `House ${i + 1}: ${regions[i + 1]}`}, bands);
    r.addEventListener("click", () => brief("house", String(i + 1)));
    r.addEventListener("keydown", e => { if (e.key === "Enter") brief("house", String(i + 1)); });
  }
  el("path", {class: "figure", d: shape}, fig);
  drawMeridians(fig);
  el("g", {id: "glyphs"}, fig);
}

// Layer 2: SCHEMATIC meridians. Posterior courses dashed. No claim of classical accuracy.
function drawMeridians(fig) {
  const lay = el("g", {id: "meridians", "aria-label": GEO._label}, fig);
  el("title", {}, lay).textContent = `Meridians - ${GEO._label}`;
  for (const [organ, m] of Object.entries(GEO.meridians)) {
    const col = `var(--${EL[organ]})`;
    const path = el("path", {class: "mer" + (m.posterior ? " posterior" : ""), id: `mer-${organ}`, d: smooth(m.path, false),
      stroke: col, "data-meridian": organ, "aria-label": `${organ.replace("_", " ")} channel - ${GEO._label}`}, lay);
    el("title", {}, path).textContent = `${organ.replace("_", " ")}${m.posterior ? " (runs on the back)" : ""} - ${GEO._label}`;
    const mid = m.path[m.label_at ?? Math.floor(m.path.length / 2)];
    el("text", {class: "mabbr", x: mid[0] + 6, y: mid[1], fill: col}, lay).textContent = m.abbr;
    for (const [code, xy] of Object.entries(m.points)) {
      const c = el("circle", {class: "mpt", cx: xy[0], cy: xy[1], r: 4.5, fill: col, tabindex: 0,
        "data-point": code, "data-meridian": organ}, lay);
      el("title", {}, c).textContent = `${code} - ${GEO._label}`;
      c.addEventListener("click", () => brief("organ", organ));
    }
  }
  el("text", {class: "mcap", x: GEO.frame.width / 2, y: GEO.frame.height + 22, "text-anchor": "middle"}, lay)
    .textContent = `Meridians: ${GEO._label}`;
}

function markMeridians(L) {
  document.querySelectorAll(".mer").forEach(p => p.classList.remove("active", "pressure"));
  if ($("t-active").checked) $(`mer-${L.active_window.organ}`)?.classList.add("active");
  (L.interactions || []).forEach(i => i.organs.forEach(o => $(`mer-${o}`)?.classList.add("pressure")));
}

// Live house lighting from ATI: today's planets bright in the house they occupy,
// the natal planets ghosted and fixed. House numbers and names only - no degrees.
function lightHouses(L) {
  document.querySelectorAll(".band").forEach(b => b.classList.remove("lit"));
  const gl = $("glyphs"); if (!gl) return; gl.innerHTML = "";
  const place = (groups, cls, dy) => (groups || []).forEach(h => {
    const y = (h.house - 1) * BH + BH / 2 + dy;
    h.bodies.forEach((b, i) => {
      const t = el("text", {class: `glyph ${cls}`, x: 160 + i * 26, y}, gl); t.textContent = b.glyph;
      el("title", {}, t).textContent = `${b.name} (${cls === "now" ? "now" : "natal"}) - house ${h.house}`;
    });
  });
  place(L.natal_ghosts, "natal", -8);
  place(L.houses_lit, "now", 20);
  (L.houses_lit || []).forEach(h => document.querySelector(`.band[data-house="${h.house}"]`)?.classList.add("lit"));
  $("housenote").textContent = L.houses_lit && L.houses_lit.length
    ? `Lit: houses ${L.houses_lit.map(h => h.house).join(", ")} - gold glyphs are now, grey glyphs are natal. Meridians: ${GEO._label}.`
    : `Houses unlit: ${L.houses_status}.`;
}

// Organ clock: the twelve windows from ATI's payload, the active one gold, interaction tags beside organs.
const angle = m => (m / 1440) * 2 * Math.PI - Math.PI / 2;
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function drawClock(L) {
  const svg = $("clock"); svg.innerHTML = ""; const R = 190;
  el("circle", {class: "ring", cx: 0, cy: 0, r: R}, svg);
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  const tags = {};
  (L.interactions || []).forEach(i => i.organs.forEach(o => (tags[o] = tags[o] || new Set()).add(i.type)));
  L.windows.forEach(w => {
    const a = angle(mins(w.start) + 60), x = R * Math.cos(a), y = R * Math.sin(a);
    const g = el("g", {style: `--el: var(--${w.element})`}, svg);
    const c = el("circle", {class: "organ" + (w.organ === L.active_window.organ ? " active" : ""), id: `organ-${w.organ}`,
      cx: x, cy: y, r: 34, tabindex: 0, "aria-label": `${w.organ_display} ${w.start} to ${w.end}`}, g);
    c.addEventListener("click", () => brief("organ", w.organ));
    c.addEventListener("keydown", e => { if (e.key === "Enter") brief("organ", w.organ); });
    el("text", {class: "oname", x, y: y - 1}, g).textContent = w.organ_display.replace("Large ", "L. ").replace("Small ", "S. ");
    el("text", {class: "otime", x, y: y + 12}, g).textContent = `${w.start}–${w.end}`;
    if (tags[w.organ]) el("text", {class: "tag", x: 1.27 * x, y: 1.27 * y + 3}, g).textContent = [...tags[w.organ]].join(" · ");
  });
  el("line", {class: "hand", x1: 0, y1: 0, x2: 0, y2: -R + 44, transform: `rotate(${angle(m) * 180 / Math.PI + 90})`}, svg);
  const t = el("text", {class: "oname", x: 0, y: 4}, svg);
  t.textContent = `${L.active_window.organ_display} · ${L.active_window.branch_display}`;
}

// Pillar strip: natal locked and dim, now bright, hour in gold and synced to the clock's branch.
function drawPillars(L) {
  const box = $("pillars"); box.innerHTML = "";
  ["year", "month", "day", "hour"].forEach(k => {
    const row = document.createElement("div"); row.className = "pill" + (k === "hour" ? " hour" : "");
    const n = L.natal_pillars ? L.natal_pillars[k].hanzi : "—";
    row.innerHTML = `<span class="k">${k.toUpperCase()}</span><span class="n" title="natal - locked">${n}</span><span class="c">${L.current_pillars[k].hanzi}</span>`;
    box.appendChild(row);
  });
  const ul = $("tags"); ul.innerHTML = "";
  if (!L.natal_pillars) { ul.innerHTML = `<li>${L.natal_status}</li>`; return; }
  if (!L.interactions.length) { ul.innerHTML = "<li>No current pillar acts on your chart this hour.</li>"; return; }
  L.interactions.forEach(i => { const li = document.createElement("li");
    li.innerHTML = `<b>${i.tag}</b> · now ${i.current} on natal ${i.natal} → ${i.organs.join(", ").replace(/_/g, " ")}`; ul.appendChild(li); });
}

// Zoom the body only; the clock and pillar strip stay where they are.
let z = 1, ox = 0, oy = 0;
const applyZoom = () => $("zoomg").setAttribute("transform", `translate(${ox} ${oy}) scale(${z})`);
const zoomBy = f => { z = Math.min(4, Math.max(1, z * f)); if (z === 1) { ox = 0; oy = 0; } applyZoom(); };
$("zin").onclick = () => zoomBy(1.25); $("zout").onclick = () => zoomBy(0.8); $("zreset").onclick = () => { z = 1; ox = oy = 0; applyZoom(); };
$("bodywrap").addEventListener("wheel", e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 0.9); }, {passive: false});
let drag = null;
$("body").addEventListener("pointerdown", e => { if (z > 1) drag = {x: e.clientX - ox, y: e.clientY - oy}; });
addEventListener("pointermove", e => { if (drag) { ox = e.clientX - drag.x; oy = e.clientY - drag.y; applyZoom(); } });
addEventListener("pointerup", () => drag = null);

// Independent layer toggles.
[["t-clock", "p-clock"], ["t-pillars", "p-pillars"]].forEach(([t, p]) => $(t).onchange = () => $(p).hidden = !$(t).checked);
$("t-houses").onchange = () => ["houses", "houselines", "glyphs"].forEach(id => { const n = $(id); if (n) n.style.display = $("t-houses").checked ? "" : "none"; });

let LAST = null;
$("t-meridians").onchange = () => { const m = $("meridians"); if (m) m.style.display = $("t-meridians").checked ? "" : "none"; };
$("t-active").onchange = () => { if (LAST) markMeridians(LAST); };
async function refresh() {
  try { const L = await ask("lighting");
    if (L.error) throw new Error(L.error);
    drawClock(L); drawPillars(L); if (!$("houses")) drawBody(L.house_regions); lightHouses(L); markMeridians(L); LAST = L;
  } catch (e) {
    $("brief").textContent = `Lighting unavailable (${e.message}). Open this page from the MycOS webapp, where ATI answers.`;
  }
}
refresh(); setInterval(refresh, 60000);
</script>
</body>
