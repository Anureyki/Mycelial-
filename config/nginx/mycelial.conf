# Mycelial — TLS + auth in front of the webapp and Anansi.  (Phase 6)
#
# Runs UNPRIVILEGED, as the same user as the agents, on a high port. It does
# not touch the system nginx serving WordPress on :80, and needs no sudo -
# every path it writes to lives under state/.
#
# What it replaces: a `python3 -m http.server 8090 --bind 0.0.0.0` serving the
# webapp in the clear, and a socat forwarder putting Anansi on 0.0.0.0:9081 in
# the clear. Two unauthenticated plaintext listeners on the LAN become one
# authenticated TLS listener.
#
# The page and the API are served from the SAME ORIGIN here, so the browser
# needs no CORS grant and the webapp needs no configured server URL.

worker_processes  1;
daemon            on;
pid               /home/anureyki/mycelial/state/nginx/nginx.pid;
error_log         /home/anureyki/mycelial/logs/nginx_error.log warn;

events { worker_connections 256; }

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    access_log          /home/anureyki/mycelial/logs/nginx_access.log;

    client_body_temp_path /home/anureyki/mycelial/state/nginx/client_body;
    proxy_temp_path       /home/anureyki/mycelial/state/nginx/proxy;
    fastcgi_temp_path     /home/anureyki/mycelial/state/nginx/fastcgi;
    uwsgi_temp_path       /home/anureyki/mycelial/state/nginx/uwsgi;
    scgi_temp_path        /home/anureyki/mycelial/state/nginx/scgi;

    sendfile      on;
    server_tokens off;

    # Photos are megabytes and the phone sends them base64-encoded, which
    # inflates them by a third. The default 1m would reject an upload that
    # worked before this proxy existed.
    client_max_body_size 25m;

    server {
        listen              8443 ssl;
        listen              [::]:8443 ssl;
        server_name         _;

        ssl_certificate     /home/anureyki/mycelial/state/certs/mycelial.crt;
        ssl_certificate_key /home/anureyki/mycelial/state/certs/mycelial.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:1m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        auth_basic           "Mycelial";
        auth_basic_user_file /home/anureyki/mycelial/state/nginx/htpasswd;

        # The webapp itself.
        location / {
            root  /home/anureyki/mycelial/webapp;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Anansi. Same origin as the page above, so no CORS and no server URL
        # to configure on the phone.
        location = /execute {
            proxy_pass         http://127.0.0.1:8081/execute;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            # Vision assessment runs in the background but a cold model load
            # can still hold the request; the phone gives up well before this.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Photo upload. THIS WAS MISSING and the omission is invisible until
        # somebody uploads: with no matching location the request fell through
        # to `location /` above, which is the static webapp root, so it passed
        # auth and then 404'd. A proxy that covers the endpoints somebody
        # remembers and not the ones they forget is a proxy with a hole in it.
        location = /upload {
            proxy_pass         http://127.0.0.1:8081/upload;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location = /health {
            proxy_pass  http://127.0.0.1:8081/health;
            auth_basic  off;          # so a health check needs no credential
        }
    }

    # THE RETIRED ORIGINS, KEPT ALIVE AS SIGNPOSTS ONLY.
    #
    # 8090 served the PWA in the clear until 2026-08-29; 9081 was socat in
    # front of Anansi. Retiring a listener does not retire the phones that
    # bookmarked it or installed it to a home screen - those still open the
    # old origin, and a browser with a service worker registered there answers
    # the navigation FROM CACHE. The result is the whole app rendering
    # perfectly with every single card reading "Load failed", and nothing in
    # this server's access log, because no request ever arrived.
    #
    # That is what happened: the phone's last contact with 8443 was 3 Sept and
    # it has been running a cached shell since. So the dead ports now answer,
    # with nothing but a redirect to the real one. No proxy_pass, no root, no
    # data - the only thing reachable here is the sentence "go to 8443".
    #
    # $host rather than a literal address, so this survives the box changing
    # IP - which it just did.
    server {
        listen      8090;
        listen      9081;
        listen      [::]:8090;
        listen      [::]:9081;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }
}
