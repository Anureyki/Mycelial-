# CNN Model Configuration
model:
  name: "ContaminationCNN"
  architecture: "custom"  # or "resnet18", "efficientnet_b0"
  pretrained: false
  num_classes: 2         # healthy / contaminated
  input_size: 224        # image size (resize to this)
  channels: 3            # RGB

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0005
  early_stopping_patience: 10
  validation_split: 0.2
  data_dir: "dataset/images"   # local or mounted IPFS path
  labels_file: "dataset/labels.csv"        # CSV with image_path, label

inference:
  confidence_threshold: 0.7

data_augmentation:
  horizontal_flip: true
  random_rotation: 15
  color_jitter: 0.2
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

logging:
  log_dir: "logs"
  checkpoint_dir: "weights"
