# RNN Model Configuration – Text sequences (billing, research)
model:
  name: "TextRNN"
  vocab_size: 5000           # max tokens in vocabulary
  embedding_dim: 128
  hidden_size: 128
  num_layers: 2
  output_size: 1             # binary classification (e.g., intent: billing vs non-billing)
  max_seq_len: 100           # max tokens per sequence

training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0005
  validation_split: 0.2
  data_dir: "dataset/text_data.csv"   # CSV with 'text' and 'label' columns

inference:
  confidence_threshold: 0.5

logging:
  log_dir: "logs"
  checkpoint_dir: "weights"
