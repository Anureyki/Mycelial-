name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile check (catch syntax errors)
        run: python -m compileall -q -x 'backup_|quarantine/' .

      - name: Install what the gates import
        # ci-requirements.txt is the whole dependency contract. Five gates
        # import requests or cryptography and CI installed neither, so the
        # build went red the moment the first of them was added and stayed
        # red for ten runs.
        run: pip install -r ci-requirements.txt

      - name: Lint for syntax errors and undefined names
        run: |
          ruff check --select=E9,F63,F7,F82 --exclude backup_20260621_053644,quarantine .

      - name: Agents agree with themselves about their capabilities
        # A capability list lives in three places - the constructor,
        # config/agent_configs/ and config/agent_cards/ - and on 2026-09-05 all
        # eleven agents disagreed with themselves. Two configs advertised ten
        # capabilities that returned "Unknown task" when called.
        #
        # --static runs only the file-reading checks, because the rest need a
        # live swarm and a check that needs running agents cannot gate a
        # commit. Drift is at zero as of that date, so any drift this reports
        # was introduced by the change being committed.
        run: python tools/check_inherited.py --static

      - name: Webapp shell cache version
        # A shell file edited without a version bump ships to nobody: the URL
        # index.html requests is unchanged, so an installed client keeps
        # serving the copy it already has. It looks deployed from the server
        # side and is invisible on the device.
        run: python tools/check_shell_version.py
      - name: Routing must reach the right department
        # The vocabularies were wrong for weeks and nothing said so.
        # A routing table has no natural alarm: every request gets an
        # answer, and the wrong department answering looks exactly
        # like the right one answering.
        run: python tools/check_routing.py
      - name: Sandbox boundary holds
        # Credential isolation, signed A2A, and a verb set that must not
        # grow by accident. Each verb is a hole in the boundary.
        run: python tools/check_sandbox.py
      - name: Interior ACL fails closed
        # Permission, not ownership. The perimeter fails open so an outage
        # does not stop work; the interior fails closed so an outage does
        # not grant access. A refactor aligning them is a regression either
        # way, so both directions are asserted.
        run: python tools/check_acl.py
      - name: Security events reach the eval harness
        # Static analysis cannot see a dead path: removing the emit import
        # left the call written, and the observer swallows exceptions. So
        # this makes a real decision and looks for the record.
        run: python tools/check_eval.py
      - name: Drift monitor detects, and stays quiet when it should
        # A monitor that has never fired is indistinguishable from one that
        # cannot. Both directions are proven: each detector on its own case,
        # and silence on normal operation.
        run: python tools/check_drift.py
      - name: Account model is deterministic and admits what it does not know
        # Two agents tracing one account must produce the same map, or the
        # map is an opinion. An unverified entry must report itself
        # incomplete rather than produce a confident one.
        run: python tools/check_accounts.py
      - name: The registries hold together as one ontology
        # Three registries that each refuse correctly on their own can still
        # be three lists. This asserts what only exists when they are joined:
        # an edge cannot invent a node, a role lives on the EDGE so one party
        # can be holder and creditor while a different company services it,
        # identity is never merged on resemblance, a clause nobody read is not
        # a clause that is absent, and the statute outranks the instrument.
        #
        # It found a real gap: a card number in a prose `note` passed the
        # registry write guard, because the field-shape rule exempts prose and
        # the prose scanner had no card pattern. One detector now, in
        # core/identifier_scan.py, used by both callers.
        run: python tools/check_ontology.py

      - name: Uncertainty survives ingestion
        # Phase 1B. The purpose is not to make the system know more - it is to
        # make it able to say WHY it believes something, with a page number,
        # and to keep saying "I do not know" through a pipeline whose whole
        # tendency is to turn documents into confident rows.
        #
        # Asserts the layer that must not collapse: a statement saying
        # "holder" establishes a string in a position, not an ownership
        # interest. interpret() deliberately does not exist here.
        run: python tools/check_ingest.py

      - name: One contract, one reader
        # The defect class that has appeared four times here, three of them
        # security or privacy failures: a meaning computed in one place and
        # re-derived in another, both working, only one right. Declared
        # contracts are asserted to have a single reader - including the one
        # deliberately DUPLICATED across the repo boundary, where the two
        # copies are compared byte-for-byte instead of forbidden.
        run: python tools/check_contracts.py

      - name: The filesystem boundary holds, and knows which boundary it is
        # Found 2026-09-13: every sensitive directory 0775 and 1,507 paths
        # readable by anyone on the box. private/ itself was 0775, which is
        # the exact opposite of its purpose, and state/memory.db and
        # state/audit.db were world-readable. /home being 0750 was the only
        # thing preventing it - a protection nobody chose and nothing checked.
        #
        # The cause will recur: os.makedirs applies the PROCESS UMASK, so the
        # same line gives 0700 under one service manager and 0775 under
        # another, invisibly. Modes are declared per path now.
        #
        # And it states what it CANNOT do. Permissions stop other USERS; the
        # ACL stops other AGENTS, who all run as the same user; the sandbox
        # stops a compromised process. Conflating them is how a system
        # acquires a boundary it does not have.
        run: python tools/check_fs_boundary.py

      - name: No commit may be created from sensitive staged content
        # Three boundaries and none substitutes for another: .gitignore stops
        # ORDINARY tracking, the pre-commit gate stops sensitive STAGED
        # CONTENT becoming a commit, history verification finds what already
        # leaked. This proves the middle one, including against `git add -f`,
        # which walks through .gitignore by design.
        #
        # It found a real bypass: the scanner listed staged filenames and then
        # read them from the WORKING TREE. Stage a secret, clean the file,
        # commit - the index still carried it. It now reads the staged blob.
        #
        # Runs in a throwaway repository: it creates commits and asserts that
        # commits do NOT exist, neither of which may touch a real checkout.
        run: python tools/check_staging_boundary.py

      - name: Git history holds by CLASS, not by known values
        # The first rewrite removed the two values that had been discovered
        # and missed two third-party names beside a capacity determination -
        # because the check asked "is the string I knew about gone?" rather
        # than "is anything of this class still present?". Patterns only; the
        # verifier never stores a value, and says SKIP where it cannot check.
        run: python tools/check_history_classes.py

      - name: Case law is reachable by caption and reviewed from the text
        # Four decisions were refused before they shelved, each for a reason
        # about the tooling and not the court. The shapes are held here.
        run: python tools/check_case_law.py

      - name: No clause ships without a citation that opens; two agents draft alike
        run: python tools/check_contract_engine.py

      - name: The custody ledger audits the chain and never argues the law
        run: python tools/check_custody.py

      - name: No sensitive material in the repository
        # The backstop. The real gate is .githooks/pre-commit, because a
        # secret caught by CI has already been pushed - this repository
        # published a Social Security number for twenty hours and clearing it
        # took a history rewrite and a force-push. Patterns only: a scanner
        # that hardcoded the secret would have republished it.
        run: python tools/check_no_secrets.py

      - name: A broken security control must refuse, not read clean
        # The defect this exists for already happened here: the registry's
        # identifier check read a field name the scanner does not return, so
        # the expression was None, "nothing found" read as clean, and an SSN
        # passed. Nothing raised. Every scanner failure mode - exception,
        # wrong type, missing contract key, malformed finding - is now proven
        # to refuse, and the refusal happens BEFORE persistence.
        #
        # PASS / SKIP / FAIL are three outcomes. Personal fixtures are absent
        # here by design, and the checks that need them print SKIP and are
        # counted - never folded into PASS, because a suite that goes green on
        # missing fixtures is reporting on its own absence.
        run: python tools/check_asset_registry.py

      - name: No agent may authorize money
        # Phase 0 of the financial programme. The ladder - read, analyze,
        # prepare, authorize, execute, verify - is ordered by CONSEQUENCE, not
        # trust: a draft nobody sent is recoverable by deleting a file, and a
        # misdirected payment is not. `authorize` and `execute` are reserved to
        # a person in code, not in config, because a config that can grant
        # execute is one edit from an agent that can move money. And nothing
        # transfers on `unknown` - 38 U.S.C. 5301(a)(1) makes the VA
        # entitlement non-assignable, which the build now refuses structurally
        # rather than discovering at transfer time.
        run: python tools/check_financial_authority.py

      - name: The model interface advises and cannot decide
        # Core's promoted checkpoint agrees with the ACL on 80.9% of real
        # permission questions and gets only 34.7% of the ALLOWS right. Wired
        # into a gate it would refuse legitimate work two times in three, so
        # the interface is advisory by construction and the construction is
        # asserted. Runs without a model: every check is static or exercises
        # the Core-is-down path, which is the path that matters most.
        run: python tools/check_core_interface.py

      - name: Retrieval still finds the right source
        # Accuracy asks whether the ANSWER looks right and never whether the
        # SOURCE was. Retrieval has no natural alarm: a lookup that returns
        # the wrong entry returns an entry, and the answer reads fine.
        run: python tools/check_retrieval.py
