<!DOCTYPE html>
<html>
<head>
    <title>🍄 Mycelial Vault</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        h1, h2 { color: #8b5cf6; }
        .button { background: #8b5cf6; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .button:hover { background: #7c3aed; }
        .button-danger { background: #ef4444; }
        .button-danger:hover { background: #dc2626; }
        .button-success { background: #22c55e; }
        .button-success:hover { background: #16a34a; }
        .upload-area { border: 2px dashed #333; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer; }
        .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .doc-card { background: #222; padding: 15px; border-radius: 8px; border-left: 4px solid #8b5cf6; }
        .doc-card .status { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
        .status-incoming { background: #eab308; color: #000; }
        .status-processed { background: #22c55e; color: #000; }
        .status-archive { background: #3b82f6; color: #000; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        a { color: #8b5cf6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>📁 Mycelial Vault</h1>
    <p><a href="/">⬅ Back to Dashboard</a></p>

    <div class="card">
        <h2>📤 Upload Document</h2>
        <div class="upload-area" id="drop-zone">
            <p>Drag & drop files here, or click to select</p>
            <input type="file" id="file-input" multiple style="display:none;">
            <button class="button" onclick="document.getElementById('file-input').click()">Choose Files</button>
        </div>
        <div id="upload-status" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h2>📋 Documents</h2>
        <div class="flex">
            <button class="button" onclick="loadVault()">🔄 Refresh</button>
            <button class="button" onclick="triggerProcessAll()">📤 Process All Incoming</button>
        </div>
        <div id="doc-list" style="margin-top: 15px;">Loading...</div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#8b5cf6'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#333'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#333';
            uploadFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

        async function uploadFiles(files) {
            const status = document.getElementById('upload-status');
            status.innerText = '';
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                status.innerText += `📤 Uploading ${file.name}...\n`;
                try {
                    const res = await fetch('/api/vault/upload', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.status === 'success') {
                        status.innerText += `✅ ${data.filename} uploaded.\n`;
                    } else {
                        status.innerText += `❌ ${file.name} failed: ${data.error}\n`;
                    }
                } catch (e) {
                    status.innerText += `❌ ${file.name} error: ${e.message}\n`;
                }
                loadVault();
            }
        }

        async function loadVault() {
            const container = document.getElementById('doc-list');
            container.innerHTML = 'Loading...';
            try {
                const res = await fetch('/api/vault/list');
                const docs = await res.json();
                if (docs.length === 0) {
                    container.innerHTML = '<p>No documents in vault.</p>';
                    return;
                }
                container.innerHTML = `<div class="doc-grid">${docs.map(doc => `
                    <div class="doc-card">
                        <strong>${doc.name}</strong><br>
                        <span class="status status-${doc.status}">${doc.status}</span><br>
                        <small>${(doc.size / 1024).toFixed(1)} KB</small><br>
                        <small>${new Date(doc.modified).toLocaleString()}</small><br>
                        <div style="margin-top: 8px;">
                            ${doc.status === 'incoming' ? `<button class="button button-success" onclick="processDoc('${doc.name}')">✅ Process</button>` : ''}
                            ${doc.status === 'processed' ? `<button class="button" onclick="archiveDoc('${doc.name}')">📦 Archive</button>` : ''}
                            <button class="button button-danger" onclick="deleteDoc('${doc.name}')">🗑️ Delete</button>
                        </div>
                    </div>
                `).join('')}</div>`;
            } catch (e) {
                container.innerHTML = `<p>Error loading vault: ${e.message}</p>`;
            }
        }

        async function processDoc(filename) {
            const res = await fetch(`/api/vault/process/${filename}`, { method: 'POST' });
            const data = await res.json();
            loadVault();
        }

        async function archiveDoc(filename) {
            const res = await fetch(`/api/vault/archive/${filename}`, { method: 'POST' });
            const data = await res.json();
            loadVault();
        }

        async function deleteDoc(filename) {
            if (!confirm(`Delete ${filename}?`)) return;
            const res = await fetch(`/api/vault/delete/${filename}`, { method: 'DELETE' });
            const data = await res.json();
            loadVault();
        }

        async function triggerProcessAll() {
            const res = await fetch('/api/vault/list');
            const docs = await res.json();
            for (const doc of docs) {
                if (doc.status === 'incoming') {
                    await processDoc(doc.name);
                }
            }
            loadVault();
        }

        loadVault();
    </script>
</body>
</html>
